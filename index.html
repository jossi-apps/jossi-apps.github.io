<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>조씨네</title>
<meta name="description" content="조씨네가 만든 앱">
<style>
:root { --bg: #FFFFFF; --fg: #191F28; --sub: #6B7684; --line: #E5E8EB; --accent: #3182F6; }
@media (prefers-color-scheme: dark) { :root { --bg: #101318; --fg: #ECEEF1; --sub: #9AA4B0; --line: #2A313B; --accent: #4C93F8; color-scheme: dark; } }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; line-height: 1.7; padding: 48px 16px; }
main { max-width: 60ch; margin: 0 auto; display: grid; gap: 24px; }
h1 { margin: 0; font-size: 28px; }
ul { margin: 0; padding: 0; list-style: none; border-top: 1px solid var(--line); }
li { padding: 14px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
a { color: var(--accent); }
p { margin: 0; color: var(--sub); }
</style>
</head>
<body>
<main>
  <h1>조씨네</h1>
  <ul>
    <li><strong>정각</strong> <span>서버시간 · <a href="jeonggak/privacy/">개인정보처리방침</a></span></li>
  </ul>
  <p>문의 jossine.apps@gmail.com</p>
</main>
</body>
</html>
